F Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#F5F5F7" font-weight="600" text-anchor="middle" >Türkçe</text><text x="60" y="390" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A1A1AA" font-weight="normal" text-anchor="start" >Si a un idioma le falta un texto, se ve en inglés (y si no, en español). Nunca ves un código raro.</text><text x="60" y="414" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A1A1AA" font-weight="normal" text-anchor="start" >Las fechas de PinDesk Plantillas también se escriben en el idioma que elijas.</text>
